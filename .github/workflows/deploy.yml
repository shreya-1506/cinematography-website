# Deploys the portfolio to GitHub Pages on every push to main.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#
# This builds with base=/cinematography-website/ because a project site is
# served from that sub-path. If you move to a custom domain or a
# <username>.github.io repo, change the build step to plain `npm run build`.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Keep the content editor out of the public build.
          VITE_ADMIN_ENABLED: 'false'
          # Point the contact form at a real endpoint (repo Settings ->
          # Secrets and variables -> Actions -> Variables).
          VITE_CONTACT_TRANSPORT: ${{ vars.VITE_CONTACT_TRANSPORT }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          # Canonical/OG/sitemap origin. Defaults to the Pages URL; set the
          # repo variable VITE_SITE_URL once you attach a custom domain.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://shreya-1506.github.io' }}
        run: npm run build:ghpages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
